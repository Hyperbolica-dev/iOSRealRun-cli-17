<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iOSRealRun</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>iOSRealRun</h1><span id="state" class="state">空闲</span></header>
  <main>
    <aside>
      <section>
        <h2>设备</h2>
        <select id="device-select"><option value="">选择设备</option></select>
        <button id="refresh-devices">刷新设备</button>
        <p id="device-info" class="muted">尚未选择设备</p>
        <p id="backend" class="muted">连接方式：—</p>
        <p id="device-status" class="muted">系统版本：— · Developer Mode：—</p>
      </section>
      <section>
        <h2>速度</h2>
        <label for="speed">米/秒</label>
        <input id="speed" type="number" min="0.1" max="20" step="0.1" value="3.3">
      </section>
      <section>
        <h2>路线</h2>
        <p><strong id="point-count">0</strong> 个点 · <strong id="distance">0 米</strong></p>
        <div class="button-row">
          <button id="undo">撤销最后一点</button>
          <button id="clear">清空路线</button>
          <button id="fit">缩放到路线</button>
        </div>
        <div class="button-row">
          <button id="start" class="primary">开始模拟</button>
          <button id="stop" class="danger" disabled>停止模拟</button>
        </div>
      </section>
      <section>
        <h2>路线文件</h2>
        <select id="route-select"><option value="">选择已保存路线</option></select>
        <div class="button-row">
          <button id="load-default">加载默认路线</button>
          <button id="load">加载路线</button>
          <label class="button" for="route-file">导入路线</label>
          <input id="route-file" type="file" accept=".txt,text/plain" hidden>
          <button id="save">保存路线</button>
          <button id="delete">删除路线</button>
        </div>
        <label for="import-coordinate">坐标格式</label>
        <select id="import-coordinate">
          <option value="wgs84">WGS-84（推荐 / Web UI 路线）</option>
          <option value="bd09">旧版 iOSRealRun（BD-09）</option>
          <option value="gcj02">GCJ-02</option>
        </select>
      </section>
      <section>
        <h2>坐标诊断</h2>
        <button id="diagnose">诊断当前首点</button>
        <pre id="coordinate-diagnostic" class="muted"></pre>
        <p id="message" class="message"></p>
        <p id="error" class="error"></p>
        <p id="progress" class="muted">循环次数：0 · 当前点：— · 已运行时间：0 秒</p>
      </section>
    </aside>
    <div id="map" aria-label="Route map"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
